<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gnosis Redirect</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #333;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      max-width: 420px;
      width: 90%;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e0e0e0;
      border-top-color: #3E6957;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: #777;
      margin-bottom: 24px;
    }
    .btn {
      display: none;
      background: #3E6957;
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover { background: #335a49; }
    .error { color: #c0392b; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div id="spinner" class="spinner"></div>
    <h1 id="title">Redirecting you...</h1>
    <p id="subtitle" class="subtitle">Please wait a moment</p>
    <a id="fallback-btn" class="btn" href="#">Go to Gnosis App</a>
  </div>

  <script>
    const BASE_NEW_WEBSITE_URL = "https://kitchen.app.gnosis.io/referral";

    (async function main() {
      const spinner = document.getElementById("spinner");
      const title = document.getElementById("title");
      const subtitle = document.getElementById("subtitle");
      const btn = document.getElementById("fallback-btn");

      try {
        const params = new URLSearchParams(window.location.search);
        const apiKey = params.get("key");

        if (!apiKey) {
          title.textContent = "No invite link found";
          subtitle.textContent = "Please use a valid invite URL.";
          spinner.classList.add("hidden");
          return;
        }

        const storageKey = "gnosis_ref_" + apiKey;
        let refCode = localStorage.getItem(storageKey);

        if (!refCode) {
          title.textContent = "Fetching your invite...";
          const res = await fetch("/referral/" + encodeURIComponent(apiKey));
          if (!res.ok) throw new Error("No codes available");
          const data = await res.json();
          refCode = data.ref;

          if (!refCode) throw new Error("No ref code in response");
          localStorage.setItem(storageKey, refCode);
        }

        const redirectUrl = BASE_NEW_WEBSITE_URL + "/" + refCode;

        title.textContent = "Redirecting you...";
        subtitle.textContent = "If automatic redirect did not work, please click the button below.";

        btn.href = redirectUrl;
        btn.style.display = "inline-block";
        btn.textContent = "Go to Gnosis App";

        window.location.href = redirectUrl;
      } catch (err) {
        spinner.classList.add("hidden");
        title.classList.add("error");
        title.textContent = "Something went wrong";
        subtitle.textContent = err.message || "Could not load invite.";
      }
    })();
  </script>
</body>
</html>
