name: gnosis-redirect
services:
  - name: web
    source_dir: /redirect-page
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    run_command: node server.js
    envs:
      - key: ADMIN_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: PORT
        value: "8080"
    http_port: 8080
